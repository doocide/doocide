name: Test and publish

# Every push and pull request: typecheck, build, test.
# Every published release: also copy the built app into doocide/doocide.github.io (served at
# https://doocide.github.io) and attach the offline doocide.html to the release.
# Setup: see the maintainers' checklist (kept outside this repo).

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          REQUIRE_BUILD: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # attach doocide.html to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push the built app to doocide.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:doocide/doocide.github.io.git site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "doocide publish"
          git config user.email "publish@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Publish ${GITHUB_REF_NAME}" -m "Built from $SOURCE"
          git push origin HEAD:main

      - name: Attach the offline file to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/doocide.html --repo "$GITHUB_REPOSITORY" --clobber
